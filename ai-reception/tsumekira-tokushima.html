<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツメキラ（TSUME☆KIRA）｜AI受付デモ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0;}
body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: #f6f3ee; color: #33302b;}
header { background: #2f4f43; color: #fff; padding: 28px 20px; text-align: center;}
header h1 { font-size: 26px; letter-spacing:.08em;}
header p { margin-top: 6px; font-size: 13px; opacity:.85;}
.demo-badge { display: inline-block; margin-top: 10px; background: #e8b34b; color: #3a2c07; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 999px;}
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px;}
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06);}
.card h2 { font-size: 17px; margin-bottom: 10px; color: #2f4f43;}
.card p,.card li { font-size: 14px; line-height: 1.8;}
.card ul { padding-left: 20px;}
table { width: 100%; border-collapse: collapse; font-size: 14px;}
td { padding: 8px 4px; border-bottom: 1px solid #eee;}
td:last-child { text-align: right; font-weight: bold; white-space: nowrap;}
#inbox { border: 2px dashed #b9c8c0;}
#inbox-list { font-size: 13px; line-height: 1.7;}
#inbox-list.empty { color: #999;}
.inbox-item { background: #f0f6f2; border-radius: 8px; padding: 10px 12px; margin-top: 8px; white-space: pre-wrap;}
#chat-launcher { position: fixed; right: 18px; bottom: 18px; background: #2f4f43; color: #fff; border: none; border-radius: 999px; padding: 14px 20px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); z-index: 50;}
#chat-window { position: fixed; right: 18px; bottom: 76px; width: min(360px, calc(100vw - 24px)); height: 480px; max-height: calc(100vh - 100px); background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); display: none; flex-direction: column; overflow: hidden; z-index: 50;}
#chat-window.open { display: flex;}
.chat-head { background: #2f4f43; color: #fff; padding: 12px 14px;}
.chat-head.name { font-weight: bold; font-size: 15px;}
.chat-head.status { font-size: 12px; opacity:.9; margin-top: 2px;}
#chat-log { flex: 1; overflow-y: auto; padding: 12px; background: #f3efe9;}
.msg { max-width: 85%; padding: 9px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;}
.msg.bot { background: #fff; border: 1px solid #e2ddd2; margin-right: auto;}
.msg.user { background: #2f4f43; color: #fff; margin-left: auto;}
.chips { padding: 8px 12px 0; display: flex; flex-wrap: wrap; gap: 6px; background: #f3efe9;}
.chip { border: 1px solid #2f4f43; color: #2f4f43; background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;}
.chat-input { display: flex; border-top: 1px solid #e5e0d5;}
.chat-input input { flex: 1; border: none; padding: 12px; font-size: 14px; outline: none;}
.chat-input button { background: #2f4f43; color: #fff; border: none; padding: 0 18px; font-size: 14px; cursor: pointer;}
</style>
</head>
<body>
<header>
<h1 id="shop-name"></h1>
<p id="shop-sub"></p>
<span class="demo-badge">これはAI受付の導入イメージ用デモです</span>
</header>
<main>
<section class="card">
<h2>このページの見どころ</h2>
<p>右下の「AI受付に聞く」を押してみてください。営業時間外でも、料金などの質問に自動で答え、予約の希望まで聞き取ります。聞き取った予約は、このページ下の「お店側の受信箱」に届く想定です（実際のお店ではメールやLINEに届きます）。</p>
</section>
<section class="card">
<h2>メニュー</h2>
<table id="menu-table"></table>
</section>
<section class="card">
<h2>お店情報</h2>
<ul id="info-list"></ul>
</section>
<section class="card" id="inbox">
<h2>お店側の受信箱（デモ表示）</h2>
<div id="inbox-list"><span class="empty">まだ予約リクエストはありません。チャットで「予約したい」と送ると、ここに届きます。</span></div>
</section>
</main>

<button id="chat-launcher">💬 AI受付に聞く</button>
<div id="chat-window" role="dialog" aria-label="AI受付チャット">
<div class="chat-head">
<div class="name" id="chat-name"></div>
<div class="status" id="chat-status">対応中</div>
</div>
<div id="chat-log"></div>
<div class="chips" id="chips"></div>
<div class="chat-input">
<input id="chat-text" type="text" placeholder="質問や予約希望を入力…" autocomplete="off">
<button id="chat-send">送信</button>
</div>
</div>

<script>
"use strict";
const SHOP = {
  "slug": "tsumekira-tokushima",
  "name": "ツメキラ（TSUME☆KIRA）",
  "genre": "ネイルサロン（深爪矯正専門）",
  "area": "徳島県徳島市",
  "hoursText": "10:00〜18:00",
  "openHour": 10,
  "closeHour": 18,
  "closedWeekday": 1,
  "closedText": "月曜日・火曜日",
  "lastReception": null,
  "parking": "駐車場があります",
  "payment": "現金のみとなります",
  "cancel": null,
  "menus": [
    {
      "name": "深爪矯正（1回）",
      "price": 5500
    },
    {
      "name": "カラー追加",
      "price": 1100
    },
    {
      "name": "フットケア 40分",
      "price": 2200
    }
  ]
};

function isOpenNow(d) {
if (SHOP.closedWeekday!= null && d.getDay() === SHOP.closedWeekday) return false;
const h = d.getHours();
return h >= SHOP.openHour && h < SHOP.closeHour;
}
function priceText(m) { return m.price!= null? "¥" + m.price.toLocaleString(): "料金はお問い合わせください";}
function menuText() { return SHOP.menus.map(m => "・" + m.name + "　" + priceText(m)).join("\n");}

function answerFor(raw) {
const t = (raw || "").replace(/\s+/g, "");
if (/駐車|車|パーキング/.test(t)) return SHOP.parking? SHOP.parking: "駐車場については正確にお答えできないため、お店に取り次ぎます。ご連絡先を教えていただけますか？";
if (/営業時間|何時|開いて|閉店|最終受付/.test(t)) return "営業時間は" + SHOP.hoursText + "です。" + (SHOP.closedText? "定休日は" + SHOP.closedText + "です。": "");
if (/定休|休み|休日/.test(t)) return SHOP.closedText? "定休日は" + SHOP.closedText + "です。": "定休日についてはお店に取り次ぎます。ご連絡先を教えていただけますか？";
if (/料金|値段|いくら|メニュー|コース|価格|プラン/.test(t)) return "メニューはこちらです。\n" + menuText() + "\nご予約は「予約したい」と送ってください。";
if (/支払|払い|カード|paypay|ペイペイ|現金/i.test(t)) return SHOP.payment? "お支払いは" + SHOP.payment + "。": "お支払い方法についてはお店に取り次ぎます。ご連絡先を教えていただけますか？";
if (/キャンセル|変更/.test(t)) return SHOP.cancel? SHOP.cancel + "。変更・キャンセルのご連絡はこのチャットでも受け付けます。": "キャンセル・変更の規定についてはお店に取り次ぎます。ご連絡先を教えていただけますか？";
if (/初めて|初回|服装|持ち物|着替え/.test(t)) return "初めての方も大歓迎です。ご不明点があればこのチャットでお気軽にどうぞ。予約時間の少し前を目安にお越しください。";
if (/場所|住所|アクセス|どこ/.test(t)) return SHOP.area? "所在地は" + SHOP.area + "です。詳しい住所はお店のホームページをご確認ください。": "住所はお店のホームページをご確認ください。";
if (/ありがとう|助かり/.test(t)) return "どういたしまして。他に気になることがあればお気軽にどうぞ。";
if (/こんにちは|こんばんは|おはよう|はじめまして/.test(t)) return "こんにちは、" + SHOP.name + "のAI受付です。料金・営業時間のご質問や、ご予約の受付ができます。";
return null;
}
const FALLBACK = "すみません、その質問は私では正確にお答えできません。お店のスタッフに取り次ぎますので、ご連絡先（お名前と電話番号）を教えていただけますか？営業時間内に折り返します。";

let flow = null;
let draft = {};
function flowReply(raw) {
const t = (raw || "").trim();
if (flow === "menu") {
const norm = s => s.replace(/\s+/g, "");
let m = SHOP.menus.find(m => norm(t).includes(norm(m.name)))
|| SHOP.menus.find(m => m.price!= null && t.includes(String(m.price)));
if (!m) {
const mins = t.match(/\d+分/);
const cat = t.replace(/\d+分/, "").replace(/コース/g, "").trim();
const cands = SHOP.menus.filter(x => (!mins || x.name.includes(mins[0])) && (!cat || x.name.includes(cat)));
if (cands.length === 1) m = cands[0];
else if (cands.length > 1) return "候補が複数あります。どちらにしますか？\n" + cands.map(c => "・" + c.name + "　" + priceText(c)).join("\n");
}
draft.menu = m? m.name + "（" + priceText(m) + "）": t;
flow = "when";
return "「" + draft.menu + "」ですね。ご希望の日時を教えてください。（例：11月25日 15時）";
}
if (flow === "when") {
draft.when = t;
flow = "name";
return draft.when + " で承ります。最後に、お名前を教えてください。";
}
if (flow === "name") {
draft.name = t;
flow = "confirm";
return "ご予約内容の確認です。\n・メニュー：" + draft.menu + "\n・日時：" + draft.when + "\n・お名前：" + draft.name + " 様\nこの内容でお店に送ってよいですか？（「はい」で送信します）";
}
if (flow === "confirm") {
if (/はい|お願い|ok|OK|送信/.test(t)) {
flow = null;
const record = { menu: draft.menu, when: draft.when, name: draft.name};
draft = {};
if (typeof onReservation === "function") onReservation(record);
return "ありがとうございます。予約リクエストをお店に送りました。空き状況を確認のうえ、お店から確定のご連絡をします。";
}
flow = null; draft = {};
return "承知しました。送信を取りやめました。最初からやり直す場合は「予約したい」と送ってください。";
}
return null;
}
function botReply(raw) {
if (flow) return flowReply(raw);
if (/予約|行きたい|空き|あき/.test(raw || "")) {
flow = "menu";
return "ご予約ですね。ご希望のメニューを教えてください。\n" + menuText();
}
return answerFor(raw) || FALLBACK;
}

// ===== 画面まわり =====
document.getElementById("shop-name").textContent = SHOP.name;
document.getElementById("shop-sub").textContent = SHOP.genre + "｜営業時間 " + SHOP.hoursText + (SHOP.closedText? "（" + SHOP.closedText + "定休）": "");
document.getElementById("chat-name").textContent = "AI受付｜" + SHOP.name;
const mt = document.getElementById("menu-table");
SHOP.menus.forEach(m => {
const tr = document.createElement("tr");
const td1 = document.createElement("td"); td1.textContent = m.name;
const td2 = document.createElement("td"); td2.textContent = priceText(m);
tr.appendChild(td1); tr.appendChild(td2); mt.appendChild(tr);
});
const il = document.getElementById("info-list");
[["営業時間", SHOP.hoursText + (SHOP.lastReception? "（最終受付 " + SHOP.lastReception + "）": "")],
["定休日", SHOP.closedText], ["駐車場", SHOP.parking], ["お支払い", SHOP.payment], ["キャンセル", SHOP.cancel]
].forEach(([k, v]) => {
if (!v) return;
const li = document.createElement("li"); li.textContent = k + "：" + v; il.appendChild(li);
});
const log = document.getElementById("chat-log");
function addMsg(text, who) {
const div = document.createElement("div");
div.className = "msg " + who;
div.textContent = text;
log.appendChild(div);
log.scrollTop = log.scrollHeight;
}
function onReservation(r) {
const list = document.getElementById("inbox-list");
const empty = list.querySelector(".empty");
if (empty) empty.remove();
const item = document.createElement("div");
item.className = "inbox-item";
item.textContent = "\nお名前：" + r.name + " 様\nメニュー：" + r.menu + "\n希望日時：" + r.when;
list.appendChild(item);
}
function send(text) {
const v = (text!= null? text: document.getElementById("chat-text").value).trim();
if (!v) return;
addMsg(v, "user");
document.getElementById("chat-text").value = "";
setTimeout(() => addMsg(botReply(v), "bot"), 250);
}
document.getElementById("chat-send").addEventListener("click", () => send());
document.getElementById("chat-text").addEventListener("keydown", e => { if (e.key === "Enter") send();});
const win = document.getElementById("chat-window");
let greeted = false;
document.getElementById("chat-launcher").addEventListener("click", () => {
win.classList.toggle("open");
if (win.classList.contains("open") &&!greeted) {
greeted = true;
const open = isOpenNow(new Date());
document.getElementById("chat-status").textContent = open? "対応中（営業時間内）": "対応中（営業時間外もAI受付が対応します）";
addMsg("こんにちは、" + SHOP.name + "のAI受付です。" + (open? "": "現在は営業時間外ですが、ご質問とご予約の受付はできます。") + "料金・営業時間のご質問や、ご予約はこちらでどうぞ。", "bot");
}
});
const chipBox = document.getElementById("chips");
const chipLabels = ["料金を教えて", "営業時間は？", "予約したい"];
if (SHOP.parking) chipLabels.splice(1, 0, "駐車場はある？");
if (SHOP.cancel) chipLabels.push("キャンセル料は？");
chipLabels.forEach(label => {
const b = document.createElement("button");
b.className = "chip"; b.textContent = label;
b.addEventListener("click", () => send(label));
chipBox.appendChild(b);
});
</script>
</body>
</html>
